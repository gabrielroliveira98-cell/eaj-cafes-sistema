{% extends 'admin/base.html' %}
{% from 'admin/_macros.html' import csrf with context %}
{% block title %}Trocar senha{% endblock %}
{% block content %}
<header class="ph"><div><p class="eyebrow">Minha conta</p><h1>Trocar senha</h1></div></header>
<form class="card form-card" method="post" style="max-width:520px">{{ csrf() }}
  <div class="stack">
    <div class="field"><label for="cur">Senha atual</label><input class="input" id="cur" name="current" type="password" autocomplete="current-password" required></div>
    <div class="field"><label for="np">Nova senha</label><input class="input" id="np" name="password" type="password" autocomplete="new-password" required minlength="10"><span class="hint">Mínimo de 10 caracteres, com letras e números.</span></div>
    <div class="field"><label for="np2">Repita a nova senha</label><input class="input" id="np2" name="password2" type="password" autocomplete="new-password" required></div>
  </div>
  <div class="form-actions"><button class="btn btn-gold" type="submit">Alterar senha</button></div>
</form>
{% endblock %}
